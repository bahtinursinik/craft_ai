name: smart_resource_ai
description: "An AI-powered app that crafts personalized fitness plans and recipes from available resources."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.1
  intl: ^0.19.0
  shared_preferences: ^2.2.2
  image_picker: ^1.0.7
  flutter_dotenv: ^5.1.0
  uuid: ^4.3.3
  flutter_markdown: ^0.6.14
  lottie: ^3.3.1
  google_fonts: ^6.1.0

  cupertino_icons: ^1.0.8
  firebase_core: ^4.3.0
  firebase_auth: ^6.1.3
  cloud_firestore: ^6.1.1
  http: ^1.6.0
  firebase_vertexai: ^2.2.0
  skeletonizer: ^1.4.3
  share_plus: ^12.0.1
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.4
  flutter_launcher_icons: ^0.14.4
  very_good_analysis: ^8.0.0
  get_it: ^9.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.10.4
  flutter_gen_runner: ^5.12.0
  mocktail: ^1.0.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/app_logo.png"

  flutter_lints: ^5.0.0

flutter:

  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/animations/
flutter_gen:
  output: lib/core/gen/
  line_length: 80